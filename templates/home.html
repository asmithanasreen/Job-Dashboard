<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Home - Job Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
background:linear-gradient(
135deg,
#001f4d,
#004aad,
#00c6ff
);
display:flex;
justify-content:center;
align-items:center;
}

.container{
text-align:center;
color:white;
}

h1{
font-size:55px;
margin-bottom:20px;
}

p{
font-size:22px;
margin-bottom:30px;
}

.card{
background:white;
color:#333;
padding:40px;
border-radius:20px;
width:700px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.btn{
display:inline-block;
padding:15px 30px;
background:#004aad;
color:white;
text-decoration:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
margin-top:20px;
}

.btn:hover{
background:#002f75;
}

.features{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-top:30px;
}

.box{
background:#f4f7fc;
padding:20px;
border-radius:12px;
}

.box h3{
color:#004aad;
margin-bottom:10px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>💼 Job Market Skill Demand Dashboard</h1>

<p>
Analyze Job Trends, Skill Demand,
Companies Hiring and Career Opportunities
</p>

<div class="features">

<div class="box">
<h3>📊 Analytics</h3>
<p>Interactive Charts</p>
</div>

<div class="box">
<h3>🔍 Search</h3>
<p>Search Skills Instantly</p>
</div>

<div class="box">
<h3>📈 Insights</h3>
<p>Market Trends</p>
</div>

</div>

<a href="/dashboard" class="btn">
🚀 Open Dashboard
</a>

</div>

</div>

</body>
</html>
